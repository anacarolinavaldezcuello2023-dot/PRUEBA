            <h1>Foro de la comunidad</h1>
            <p class="presentacion-foro">Espacio para debatir, hacer preguntas y compartir sobre robótica.</p>
        </header>

        <!--SECCIÓN PARA HACER EL ESPACIO DEL FORO-->
        <main class="seccion-principal">
            <section class="espacio-foro">
                <h3>Crear un nuevo tema de discusión</h3>
                
             <form action="#" method="POST" class="formulario-foro">

             <div class="espacio-campo">
                <label for="nombre">Tu Nombre:</label>
                <input type="text" id="nombre" name="nombre" required class="control-entrada">
             </div>
    
            <div class="espacio-campo">
                <label for="mensaje">Detalle sobre tu aporte:</label>
                <br>
                <textarea id="mensaje" name="mensaje" rows="5" required placeholder="Escribí acá..." class="control-entrada-area-del-texto"></textarea>
            </div>
    
            <button type="submit" class="boton-publicar">Publicar en el Foro</button>
            </form>
        
        </section>
        </main>

    </div>
</body>
